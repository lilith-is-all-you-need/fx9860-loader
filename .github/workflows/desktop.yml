name: WinUI desktop build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check desktop job contracts
        run: python -m unittest discover -s tests -v
      - name: Publish native WinUI desktop
        run: dotnet publish desktop/ProfileStudio/ProfileStudio.csproj -c Release -r win-x64 --self-contained true -o C:/profile-studio-publish
